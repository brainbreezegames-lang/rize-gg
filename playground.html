<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Try it — Design Process Engine</title>
    <meta
      name="description"
      content="Type what you want to build. We run the design process for you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__grid"></div>
    </div>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="./index.html">
          <span class="brand__mark">◆</span>
          <span class="brand__name">Design Process Engine</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span></span>
          <span class="sr-only">Menu</span>
        </button>
        <nav class="nav" id="site-nav" data-nav>
          <a href="./playground.html" aria-current="page">Try it</a>
          <a href="./docs.html">How it works</a>
          <a href="./pricing.html">Pricing</a>
        </nav>
      </div>
    </header>

    <main class="page shell easy">
      <section class="easy-hero" data-reveal>
        <p class="section-label">For humans, not developers</p>
        <h1 class="section-title">Just say what you want to build</h1>
        <p class="section-lede">
          You only type one sentence. We run the senior-designer process for you
          — classify, playbook, plan, review, final check. No forms full of
          jargon.
        </p>
      </section>

      <form id="easy-form" class="easy-form" data-reveal>
        <label for="wish" class="easy-label">What do you want?</label>
        <textarea
          id="wish"
          rows="3"
          required
          placeholder="Example: A signup flow for a banking app"
        ></textarea>
        <div id="examples" class="chips" aria-label="Examples"></div>
        <button id="btn-go" class="btn btn--primary" type="submit">
          Build my plan
        </button>
      </form>

      <div id="steps" class="easy-steps" aria-live="polite"></div>
      <div id="result" class="easy-result" hidden></div>
    </main>

    <script src="./main.js"></script>
    <script src="./playground.js"></script>
  </body>
</html>
